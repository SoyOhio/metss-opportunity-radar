name: Inventory Grants.gov

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: write

concurrency:
  group: grants-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory every current Grants.gov opportunity without AI
        run: node scripts/inventory-grants.mjs

      - name: Save inventory changes
        run: |
          if git diff --quiet -- monitor/grants-inventory.json; then
            echo "No Grants.gov inventory changes."
            exit 0
          fi
          git config user.name "METSS Opportunity Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add monitor/grants-inventory.json
          git commit -m "Update Grants.gov inventory"
          git pull --rebase
          git push
