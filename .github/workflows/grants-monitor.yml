name: Monitor Grants.gov

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 0"

permissions:
  contents: write

concurrency:
  group: grants-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory, screen, and deeply review Grants.gov opportunities
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRIAGE_MODEL: gpt-5.6-luna
          OPENAI_MODEL: gpt-5.6-terra
          TRIAGE_BATCH_SIZE: "25"
          DEEP_REVIEW_BATCH_SIZE: "20"
          MAX_ESTIMATED_RUN_SPEND_USD: "4.50"
          TRIAGE_INPUT_USD_PER_MILLION: "1"
          TRIAGE_OUTPUT_USD_PER_MILLION: "6"
          REVIEW_INPUT_USD_PER_MILLION: "2.5"
          REVIEW_OUTPUT_USD_PER_MILLION: "15"
        run: node scripts/scan-grants-exhaustive.mjs

      - name: Publish changed intelligence
        run: |
          if git diff --quiet -- app/generated/grants.json monitor/grants-screening-cache.json monitor/grants-inventory.json; then
            echo "No opportunity intelligence changed."
            exit 0
          fi
          git config user.name "METSS Opportunity Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add app/generated/grants.json monitor/grants-screening-cache.json monitor/grants-inventory.json
          git commit -m "Update exhaustive Grants.gov opportunity intelligence"
          git pull --rebase
          git push
